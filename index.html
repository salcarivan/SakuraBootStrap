<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura-Bootstrap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container-fluid px-0">
        <div class="row g-0">
            <header
                class="header-sakura d-flex flex-column align-items-center justify-content-center text-center py-4 w-100">

                <!-- Bloque símbolo + título: vertical en móvil, horizontal en desktop -->
                <div
                    class="marca-sakura d-flex flex-column flex-md-row align-items-center justify-content-center gap-3 mb-3">

                    <!-- Símbolo dentro de un círculo -->
                    <div class="simbolo-circulo d-flex align-items-center justify-content-center">
                        <span>&#x685C;</span>
                    </div>

                    <!-- Título -->
                    <h1 class="titulo-sakura mb-0">
                        Sakura <span class="subtitulo">Bootstrap</span>
                    </h1>
                </div>

                <!-- Menú de navegación -->
                <nav class="menu-sakura" aria-label="Navegación principal">
                    <ul class="nav flex-column flex-sm-row justify-content-center gap-2 gap-sm-4">
                        <li class="nav-item">
                            <a class="nav-link" href="#historia">Historia</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#menu">Menú</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#galeria">Galería</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#visitanos">Visítanos</a>
                        </li>
                    </ul>
                </nav>
            </header>
        </div>
    </div>

    <script type="text/javascript" src="jquery/jquery-3.7.1.min.js"></script>
    <script tyè="text/javascript" src="bootstrap/js/bootstrap.min.js"></script>
</body>

</html>
